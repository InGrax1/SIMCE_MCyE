name: Integración continua

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validar:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: simce_test
          MYSQL_USER: simce
          MYSQL_PASSWORD: ${{ github.run_id }}
          MYSQL_ROOT_PASSWORD: ${{ github.run_id }}-root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -u root -p${MYSQL_ROOT_PASSWORD} --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    steps:
      - name: Obtén el código
        uses: actions/checkout@v4

      - name: Configura Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Instala dependencias reproducibles
        run: npm ci

      - name: Ejecuta controles locales
        run: npm run check

      - name: Compila API, panel y portal
        run: npm run build

      - name: Verifica el prototipo integral
        run: npm run prototype

      - name: Prueba persistencia MySQL
        env:
          TEST_MYSQL: 1
          NODE_ENV: test
          DATABASE_HOST: 127.0.0.1
          DATABASE_PORT: 3306
          DATABASE_NAME: simce_test
          DATABASE_USER: simce
          DATABASE_PASSWORD: ${{ github.run_id }}
        run: npm run test --workspace @simce/api

  secretos:
    runs-on: ubuntu-latest
    steps:
      - name: Obtén todo el historial
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Analiza secretos versionados
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
