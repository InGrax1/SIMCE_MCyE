services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DATABASE_NAME:-simce}
      MYSQL_USER: ${DATABASE_USER:-simce}
      MYSQL_PASSWORD: ${DATABASE_PASSWORD:?Define DATABASE_PASSWORD en el entorno}
      MYSQL_ROOT_PASSWORD: ${DATABASE_ROOT_PASSWORD:?Define DATABASE_ROOT_PASSWORD en el entorno}
    volumes:
      - simce_mysql:/var/lib/mysql
    healthcheck:
      test: ['CMD-SHELL', 'mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD --silent']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  api:
    build:
      context: .
      dockerfile: deploy/Dockerfile.api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      STORAGE: mysql
      TRUST_PROXY_HOPS: 1
      DATABASE_HOST: db
      DATABASE_PORT: 3306
      DATABASE_NAME: ${DATABASE_NAME:-simce}
      DATABASE_USER: ${DATABASE_USER:-simce}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:?Define DATABASE_PASSWORD en el entorno}
      JWT_SECRET: ${JWT_SECRET:?Define JWT_SECRET aleatorio en el entorno}
      CMS_ORIGENES: ${CMS_ORIGENES:?Define CMS_ORIGENES con la URL del panel}
      CMS_DIR: /app/.local/cms
      AVISO_INTERES_URL: ${AVISO_INTERES_URL:-}
      AVISO_INTERES_VERSION: ${AVISO_INTERES_VERSION:-}
    volumes:
      - simce_cms:/app/.local/cms
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/api/v1/salud/listo').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 10

  web:
    build:
      context: .
      dockerfile: deploy/Dockerfile.web
    restart: unless-stopped
    ports:
      - '${HTTP_BIND_ADDRESS:-127.0.0.1}:${HTTP_PORT:-8080}:80'
    depends_on:
      api:
        condition: service_healthy

volumes:
  simce_mysql:
  simce_cms:
